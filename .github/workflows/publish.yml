name: publish
on:
  push:
    tags: ["*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: poetry build --no-interaction
      - uses: pypa/gh-action-pypi-publish@release/v1
